# Render service manifest for aw-abetanalytics. Import via Render → New → Blueprint
# (host this file publicly) or apply from the dashboard.
#
# All envVars have `sync: false` — values are not committed here. Set
# them in your Render service's Environment tab, or in a shared env group
# if multiple services need the same secret.
services:
  - type: web
    name: aw-abetanalytics
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_APP_URL
        sync: false       # this service's own public origin, no trailing slash
      - key: DATABASE_URL
        sync: false       # Postgres connection string (SQLite default is dev-only)
      - key: REDIS_URL
        sync: false       # BullMQ broker for the queues src/lib/queue.ts declares
      - key: PRODUCT_NAME
        value: "abetanalytics"
      - key: STRIPE_SECRET_KEY
        sync: false       # optional; billing 500s without it
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_FLAT_MONTHLY
        sync: false
      - key: STRIPE_PRICE_FLAT_ANNUAL
        sync: false
      - key: SESSION_COOKIE
        sync: false       # optional; defaults to abetworks_session
      - key: RESEND_API_KEY
        sync: false       # optional; without a provider mail is logged, not sent
      - key: EMAIL_FROM
        sync: false       # e.g. "Abetworks <noreply@abetworks.in>"
      - key: EMAIL_WEBHOOK_URL
        sync: false       # alternative to Resend; same {from,to,subject,html,text} JSON
      - key: EMAIL_WEBHOOK_TOKEN
        sync: false       # sent as Authorization: Bearer to EMAIL_WEBHOOK_URL
      - key: LLM_API_KEY
        sync: false       # optional; without a key metric explanations are omitted, the numbers unaffected
      - key: LLM_BASE_URL
        sync: false       # optional; OpenAI-compatible base (default https://api.openai.com/v1)
      - key: LLM_MODEL
        sync: false       # optional; default gpt-4o-mini
      - key: LLM_TIMEOUT_MS
        sync: false       # optional; default 12000
